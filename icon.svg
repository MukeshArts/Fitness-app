<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1A1A1B"/>
      <stop offset="100%" style="stop-color:#111112"/>
    </linearGradient>
    <filter id="glow">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#E1FF00" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)"/>
  <rect width="512" height="512" rx="100" fill="none" stroke="#E1FF00" stroke-width="5" opacity="0.15"/>

  <!-- ===== DUMBBELL ===== -->
  <!-- Center bar -->
  <rect x="156" y="148" width="200" height="18" rx="9" fill="#E1FF00" filter="url(#glow)"/>

  <!-- Left inner tall plate -->
  <rect x="118" y="106" width="22" height="102" rx="6" fill="#E1FF00" filter="url(#glow)"/>
  <!-- Left outer short cap -->
  <rect x="88" y="126" width="16" height="62" rx="5" fill="#E1FF00" filter="url(#glow)"/>

  <!-- Right inner tall plate -->
  <rect x="372" y="106" width="22" height="102" rx="6" fill="#E1FF00" filter="url(#glow)"/>
  <!-- Right outer short cap -->
  <rect x="408" y="126" width="16" height="62" rx="5" fill="#E1FF00" filter="url(#glow)"/>

  <!-- ===== FITFORGE as shapes (each letter hand-drawn as path) ===== -->
